name: LYST
description: 'Lyst is a global fashion aggregation and shopping platform that consolidates
  products from more than 27,000 brands and retailers, connecting roughly 160 million
  annual shoppers with clothing, shoes, bags, accessories and jewelry across a single
  personalized, AI-driven catalog. Rather than a public developer API, Lyst exposes
  a partner surface: brands and retailers integrate via product-feed synchronization
  and a Stripe-powered "Lyst Shop" checkout, with API access granted privately during
  a two-week partner onboarding. Backed by Accel and Balderton Capital, Lyst also runs
  an engineering organization (making.lyst.com, github.com/lyst) best known for the
  open-source LightFM recommendation library.'
